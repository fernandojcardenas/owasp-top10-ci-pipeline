{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ note["title"] }}</h1>
  <!-- FIX (A03:2021 Injection - Stored XSS): the `safe` filter is gone, so Jinja2's automatic
       HTML escaping is back in effect. Any <script> saved in a note's content now renders as
       inert text instead of executing. See docs/vulnerabilities/04-stored-xss-notes.md. -->
  <div class="note-content">{{ note["content"] }}</div>
  <a class="back-link" href="{{ url_for('main.notes_list') }}">Back</a>
</div>
{% endblock %}
