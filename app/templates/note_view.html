{% extends "base.html" %}
{% block content %}
<h1>{{ note["title"] }}</h1>
<!-- VULN (A03:2021 Injection - Stored XSS): the `safe` filter disables Jinja2's automatic HTML
     escaping. Any <script> saved in a note's content will execute in the browser of anyone who
     views this note, including other users. -->
<div>{{ note["content"] | safe }}</div>
<p><a href="{{ url_for('main.notes_list') }}">Back</a></p>
{% endblock %}
