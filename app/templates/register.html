{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Register</h1>
  <form method="post" class="stacked">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input type="text" name="username">
    </label>
    <label>Password
      <input type="password" name="password">
    </label>
    <button type="submit">Create account</button>
  </form>
  <p class="helper-text">Already have an account? <a href="{{ url_for('main.login') }}">Log in</a></p>
</div>
{% endblock %}
