{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
<form method="post">
  <label>Username <input type="text" name="username"></label><br>
  <label>Password <input type="password" name="password"></label><br>
  <button type="submit">Log in</button>
</form>
<p>No account? <a href="{{ url_for('main.register') }}">Register</a></p>
{% endblock %}
