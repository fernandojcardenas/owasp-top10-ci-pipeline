{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  <form method="post" class="stacked">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input type="text" name="username">
    </label>
    <label>Password
      <input type="password" name="password">
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="helper-text">No account? <a href="{{ url_for('main.register') }}">Register</a></p>
</div>
{% endblock %}
